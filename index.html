<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>বুক রিডার</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
  :root {
    --bg: #14121a;
    --bg-2: #1c1926;
    --ink: #ece6d8;
    --muted: #948d9c;
    --paper: #f6efdd;
    --accent: #c9a24b;
    --accent-dim: rgba(201, 162, 75, 0.18);
    --bar-bg: rgba(255,255,255,0.045);
    --bar-border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background: radial-gradient(ellipse 1100px 600px at 50% 32%, var(--bg-2), var(--bg) 70%);
    color: var(--ink);
    font-family: "Hind Siliguri", "Inter", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  header {
    padding: 22px 28px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .wordmark {
    font-family: "Fraunces", serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .wordmark span { color: var(--accent); }

  #changeBookBtn {
    display: none;
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  #changeBookBtn:hover { color: var(--ink); border-color: rgba(255,255,255,0.3); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px 30px;
  }

  /* ---------- আপলোড স্ক্রিন ---------- */
  #uploadScreen {
    text-align: center;
    max-width: 380px;
    padding: 44px 36px;
    border-radius: 18px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #uploadScreen .icon { width: 46px; height: 46px; margin: 0 auto 18px; color: var(--accent); }
  #uploadScreen h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 21px; margin: 0 0 8px; }
  #uploadScreen p { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.6; }

  .pick-btn {
    display: inline-block;
    background: var(--accent);
    color: #1a1508;
    font-weight: 500;
    font-size: 15px;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .pick-btn:hover { filter: brightness(1.08); }
  #pdfInput { display: none; }

  /* ---------- রিডার এলাকা ---------- */
  #readerArea {
    display: none;
    width: 100%;
    max-width: 1180px;
    flex-direction: column;
    align-items: center;
  }
  #readerArea.active { display: flex; }

  #readerArea:fullscreen,
  #readerArea:-webkit-full-screen {
    background: var(--bg);
    justify-content: center;
    padding: 20px;
  }

  #stage {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  #stage::before {
    content: "";
    position: absolute;
    left: 50%; bottom: -26px;
    width: 60%; height: 36px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), transparent 72%);
    filter: blur(2px);
    pointer-events: none;
  }

  #loading { display: none; margin: 80px 0; text-align: center; color: var(--muted); font-size: 15px; }
  #loading.active { display: block; }
  #loading .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* বইয়ের প্রকৃত সাইজ এখানে নির্ধারিত হয় — পুরো readerArea-এর প্রস্থ ব্যবহার করে */
  #bookWrap {
    width: 100%;
    max-width: 1000px;
    transform-origin: top center;
    transition: transform 0.15s ease;
  }
  #book { width: 100%; display: none; }
  .page { background: var(--paper); }
  .page canvas { width: 100%; height: 100%; display: block; }

  #controls {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 40px;
  }
  #controls.active { display: flex; }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    border-radius: 999px;
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    backdrop-filter: blur(6px);
  }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: var(--accent-dim); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; background: none; color: var(--ink); }

  .page-jump {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    font-size: 13.5px;
    color: var(--muted);
  }
  #pageInput {
    width: 40px;
    text-align: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
    padding: 4px 2px;
  }
  #pageInput::-webkit-outer-spin-button,
  #pageInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #errorBox {
    display: none;
    max-width: 420px;
    margin: 24px auto 0;
    padding: 14px 18px;
    border-radius: 10px;
    background: rgba(220, 90, 70, 0.1);
    border: 1px solid rgba(220, 90, 70, 0.3);
    color: #e8b9ae;
    font-size: 13.5px;
    text-align: center;
  }

  @media (max-width: 640px) {
    #bookWrap { max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    #loading .spinner { animation: none; border-top-color: var(--accent-dim); }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">পাঠ<span>ঘর</span></div>
  <button id="changeBookBtn">নতুন PDF খুলুন</button>
</header>

<main>

  <div id="uploadScreen">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>আপনার বইটি খুলুন</h1>
    <p>ফোন থেকে একটি PDF ফাইল বেছে নিন — পাতা উল্টিয়ে বইয়ের মতো পড়তে পারবেন। ফাইলটি শুধু আপনার ব্রাউজারেই খোলে, কোথাও আপলোড হয় না।</p>
    <label class="pick-btn" for="pdfInput">PDF বেছে নিন</label>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" />
  </div>

  <div id="readerArea">
    <div id="stage">
      <div id="loading">
        <div class="spinner"></div>
        বই খোলা হচ্ছে...
      </div>
      <div id="bookWrap">
        <div id="book"></div>
      </div>
    </div>

    <div id="controls">
      <div class="btn-group">
        <button class="icon-btn" id="firstBtn" title="প্রথম পাতা">⏮</button>
        <button class="icon-btn" id="prevBtn" title="আগের পাতা">‹</button>
        <div class="page-jump">
          <input type="number" id="pageInput" min="1" value="1" />
          <span id="totalPages">/ ১</span>
        </div>
        <button class="icon-btn" id="nextBtn" title="পরের পাতা">›</button>
        <button class="icon-btn" id="lastBtn" title="শেষ পাতা">⏭</button>
      </div>

      <div class="btn-group">
        <button class="icon-btn" id="zoomOutBtn" title="জুম আউট">−</button>
        <button class="icon-btn" id="zoomInBtn" title="জুম ইন">+</button>
        <button class="icon-btn" id="fullscreenBtn" title="ফুল-স্ক্রিন">⛶</button>
      </div>
    </div>
  </div>

  <div id="errorBox"></div>
</main>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const bnDigits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const toBn = (n) => String(n).split("").map(d => bnDigits[d] ?? d).join("");
  const toEnDigits = (s) => String(s).replace(/[০-৯]/g, (d) => bnDigits.indexOf(d));

  const uploadScreen   = document.getElementById("uploadScreen");
  const readerArea     = document.getElementById("readerArea");
  const loadingEl      = document.getElementById("loading");
  const bookWrap       = document.getElementById("bookWrap");
  const bookEl         = document.getElementById("book");
  const controlsEl     = document.getElementById("controls");
  const errorBox       = document.getElementById("errorBox");
  const changeBookBtn  = document.getElementById("changeBookBtn");
  const pageInput      = document.getElementById("pageInput");
  const totalPagesLbl  = document.getElementById("totalPages");

  let pageFlip;
  let totalPages = 0;
  let zoom = 1;

  function updateCounter(current) {
    pageInput.value = current + 1;
    totalPagesLbl.textContent = `/ ${toBn(totalPages)}`;
    document.getElementById("firstBtn").disabled = current === 0;
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").disabled = current === totalPages - 1;
    document.getElementById("lastBtn").disabled = current === totalPages - 1;
  }

  function goToPage(index) {
    const clamped = Math.max(0, Math.min(totalPages - 1, index));
    pageFlip.turnToPage(clamped);
    updateCounter(clamped);
  }

  function applyZoom() {
    bookWrap.style.transform = `scale(${zoom})`;
  }

  function showError(message) {
    loadingEl.classList.remove("active");
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function resetToUpload() {
    uploadScreen.style.display = "block";
    readerArea.classList.remove("active");
    controlsEl.classList.remove("active");
    changeBookBtn.style.display = "none";
    errorBox.style.display = "none";
    bookEl.innerHTML = "";
    bookEl.style.display = "none";
    zoom = 1;
    applyZoom();
    document.getElementById("pdfInput").value = "";
  }

  async function openPDF(file) {
    uploadScreen.style.display = "none";
    readerArea.classList.add("active");
    loadingEl.classList.add("active");
    errorBox.style.display = "none";

    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPages = pdf.numPages;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2 });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        if (i === 1 || i === pdf.numPages) pageDiv.setAttribute("data-density", "hard");
        pageDiv.appendChild(canvas);
        bookEl.appendChild(pageDiv);
      }

      loadingEl.classList.remove("active");
      bookEl.style.display = "block";
      controlsEl.classList.add("active");
      changeBookBtn.style.display = "inline-block";

      // প্রথম পাতার আকার (উচ্চতা/প্রস্থ অনুপাত) থেকে বইয়ের base সাইজ ঠিক করা হচ্ছে
      const firstPage = await pdf.getPage(1);
      const baseViewport = firstPage.getViewport({ scale: 1 });
      const aspect = baseViewport.height / baseViewport.width;
      const baseWidth = 480;
      const baseHeight = Math.round(baseWidth * aspect);

      // bookWrap-কে একটা নির্দিষ্ট প্রস্থ দেওয়া হচ্ছে, যাতে "stretch" মোড সঠিক জায়গা মেপে
      // বড় স্ক্রিনে দুই-পাতা (spread) আর ছোট স্ক্রিনে এক-পাতা মোড বেছে নিতে পারে
      pageFlip = new St.PageFlip(bookEl, {
        width: baseWidth,
        height: baseHeight,
        size: "stretch",
        minWidth: 260,
        maxWidth: 700,
        minHeight: Math.round(260 * aspect),
        maxHeight: Math.round(700 * aspect),
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: true,
        drawShadow: true,
        maxShadowOpacity: 0.5,
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));
      pageFlip.on("flip", (e) => updateCounter(e.data));
      updateCounter(0);
    } catch (err) {
      showError("বইটা খোলা যায়নি। ফাইলটা ঠিকঠাক PDF কিনা যাচাই করুন। (" + err.message + ")");
      console.error(err);
    }
  }

  document.getElementById("pdfInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) openPDF(file);
  });

  changeBookBtn.addEventListener("click", resetToUpload);

  document.getElementById("firstBtn").addEventListener("click", () => goToPage(0));
  document.getElementById("prevBtn").addEventListener("click", () => pageFlip.flipPrev());
  document.getElementById("nextBtn").addEventListener("click", () => pageFlip.flipNext());
  document.getElementById("lastBtn").addEventListener("click", () => goToPage(totalPages - 1));

  pageInput.addEventListener("change", () => {
    const n = parseInt(toEnDigits(pageInput.value), 10);
    if (!isNaN(n)) goToPage(n - 1);
  });

  document.getElementById("zoomOutBtn").addEventListener("click", () => {
    zoom = Math.max(0.6, +(zoom - 0.15).toFixed(2));
    applyZoom();
  });
  document.getElementById("zoomInBtn").addEventListener("click", () => {
    zoom = Math.min(1.8, +(zoom + 0.15).toFixed(2));
    applyZoom();
  });

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      readerArea.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  });
</script>

</body>
</html>
