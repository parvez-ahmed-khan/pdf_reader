<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>বুক রিডার - পাঠঘর</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
  :root {
    --bg: #0f0e13;
    --bg-2: #1a1723;
    --ink: #ece6d8;
    --muted: #948d9c;
    --paper: #f6efdd;
    --accent: #c9a24b;
    --accent-dim: rgba(201, 162, 75, 0.16);
    --bar-bg: rgba(28, 25, 38, 0.92);
    --bar-border: rgba(255, 255, 255, 0.14);
    --radius-lg: 20px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }

  body {
    background: radial-gradient(ellipse 1200px 700px at 50% 30%, var(--bg-2), var(--bg) 75%);
    color: var(--ink);
    font-family: "Hind Siliguri", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  header {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 10;
    height: 50px;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: "Fraunces", serif;
    font-size: 20px;
    font-weight: 600;
  }
  .wordmark span { color: var(--accent); }

  #changeBookBtn {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: var(--radius-full);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  #changeBookBtn:hover { color: var(--ink); border-color: rgba(255,255,255,0.32); background: rgba(255,255,255,0.05); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    width: 100%;
    height: calc(100% - 50px);
  }

  /* ---------- আপলোড স্ক্রিন ---------- */
  #uploadScreen {
    text-align: center;
    max-width: 400px;
    width: 90%;
    padding: 40px 28px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
  }
  #uploadScreen .icon-wrap {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
  }
  #uploadScreen .icon-wrap svg { width: 26px; height: 26px; color: var(--accent); }
  #uploadScreen h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 22px; margin: 0 0 8px; }
  #uploadScreen p { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; line-height: 1.5; }

  .pick-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent);
    color: #1a1202;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 24px;
    border-radius: var(--radius-full);
    cursor: pointer;
    box-shadow: 0 10px 20px -8px rgba(201, 162, 75, 0.5);
    transition: all 0.2s ease;
  }
  .pick-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  #pdfInput { display: none; }

  /* ---------- রিডার এলাকা ---------- */
  #readerArea {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    padding-bottom: 10px;
  }
  #readerArea.active { display: flex; animation: rise 0.3s ease forwards; }
  @keyframes rise { to { opacity: 1; } }

  #stage {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }

  /* সাইড অ্যারো বাটন */
  .side-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(28, 25, 38, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 25;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
    opacity: 0.7;
  }
  .side-nav-btn:hover {
    opacity: 1;
    background: var(--accent);
    color: #1a1202;
    border-color: var(--accent);
  }
  .side-nav-btn.left { left: 14px; }
  .side-nav-btn.right { right: 14px; }
  .side-nav-btn svg { width: 22px; height: 22px; }

  #loading { display: none; text-align: center; color: var(--muted); font-size: 14px; }
  #loading.active { display: block; }
  #loading .spinner {
    width: 32px; height: 32px; margin: 0 auto 12px;
    border-radius: 50%;
    border: 3px solid var(--accent-dim);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #bookWrap {
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    will-change: transform;
    transition: transform 0.05s ease-out;
  }
  
  #book { 
    display: none; 
    margin: 0 auto; 
    box-shadow: 0 25px 60px rgba(0,0,0,0.7); 
    pointer-events: none; 
  }
  .page { background: var(--paper); overflow: hidden; }
  .page canvas { width: 100%; height: 100%; display: block; object-fit: contain; }

  /* ভাসমান কন্ট্রোল বার */
  #controls {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 4px 10px;
    z-index: 30;
    max-width: 98vw;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
  }
  #controls::-webkit-scrollbar { display: none; }
  #controls.active { display: flex; }

  .btn-group {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 4px 8px;
    border-radius: var(--radius-full);
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn:hover:not(:disabled) { background: var(--accent-dim); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.25; cursor: default; }
  .icon-btn.muted { opacity: 0.4; }

  .divider { width: 1px; height: 16px; background: rgba(255,255,255,0.15); margin: 0 3px; flex-shrink: 0; }

  .page-jump {
    display: flex; align-items: center; gap: 4px;
    padding: 0 4px;
    font-size: 12.5px;
    color: var(--muted);
  }
  #pageInput {
    width: 36px; text-align: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 6px;
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    padding: 2px 0;
  }
  #pageInput::-webkit-outer-spin-button, #pageInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #errorBox {
    display: none;
    max-width: 400px;
    margin: 15px auto 0;
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(220, 90, 70, 0.12);
    border: 1px solid rgba(220, 90, 70, 0.3);
    color: #f1b3a5;
    font-size: 13px;
    text-align: center;
  }

  @media (max-width: 640px) {
    header { padding: 6px 12px; }
    .btn-group { padding: 3px 5px; gap: 1px; }
    .icon-btn { width: 29px; height: 29px; }
    .icon-btn svg { width: 14px; height: 14px; }
    #pageInput { width: 30px; font-size: 12px; }
    .page-jump { font-size: 11.5px; padding: 0 2px; }
    .side-nav-btn { width: 36px; height: 36px; }
    .side-nav-btn.left { left: 6px; }
    .side-nav-btn.right { right: 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">পাঠ<span>ঘর</span></div>
  <button id="changeBookBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10a6 6 0 1 1 1.8 4.3M4 10V6m0 4h4"/></svg>
    নতুন PDF
  </button>
</header>

<main>

  <div id="uploadScreen">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4c-2-1-4.5-1.5-7-1.5v15c2.5 0 5 .5 7 1.5m0-15c2-1 4.5-1.5 7-1.5v15c-2.5 0-5 .5-7 1.5m0-15v15"/></svg>
    </div>
    <h1>আপনার বইটি খুলুন</h1>
    <p>আপনার ডিভাইস থেকে PDF বেছে নিন — মোবাইল ও কম্পিউটারে নিখুঁত দেখাবে।</p>
    <label class="pick-btn" for="pdfInput">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3v10m0 0-3.5-3.5M10 13l3.5-3.5M4 15.5v1a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-1"/></svg>
      PDF ফাইল বেছে নিন
    </label>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" />
  </div>

  <div id="readerArea">
    <div id="stage">
      <button id="sidePrevBtn" class="side-nav-btn left" title="আগের পাতা">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.5 5 7.5 10l5 5"/></svg>
      </button>
      <button id="sideNextBtn" class="side-nav-btn right" title="পরের পাতা">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.5 5l5 5-5 5"/></svg>
      </button>

      <div id="loading">
        <div class="spinner"></div>
        বই প্রসেসিং করা হচ্ছে...
      </div>
      <div id="bookWrap">
        <div id="book"></div>
      </div>
    </div>

    <div id="controls">
      <div class="btn-group">
        <button class="icon-btn" id="firstBtn" title="প্রথম পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9.5 5 4.5 10l5 5M15.5 5v10"/></svg>
        </button>
        <button class="icon-btn" id="prevBtn" title="আগের পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12.5 5 7.5 10l5 5"/></svg>
        </button>
        <div class="page-jump">
          <input type="number" id="pageInput" min="1" value="1" aria-label="পাতা নম্বর" />
          <span id="totalPages">/ ১</span>
        </div>
        <button class="icon-btn" id="nextBtn" title="পরের পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7.5 5l5 5-5 5"/></svg>
        </button>
        <button class="icon-btn" id="lastBtn" title="শেষ পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.5 5l5 5-5 5M4.5 5v10"/></svg>
        </button>
      </div>

      <div class="btn-group">
        <button class="icon-btn" id="zoomOutBtn" title="জুম আউট">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M17 17l-3.8-3.8M6 8.5h5"/></svg>
        </button>
        <button class="icon-btn" id="zoomInBtn" title="জুম ইন">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M17 17l-3.8-3.8M8.5 6v5M6 8.5h5"/></svg>
        </button>
        <button class="icon-btn" id="rotateLeftBtn" title="বামে ঘোরান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="icon-btn" id="rotateRightBtn" title="ডানে ঘোরান">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="resetViewBtn" title="পজিশন রিসেট">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z"/><path d="M12 8v8M8 12h8"/></svg>
        </button>
        <div class="divider"></div>
        <button class="icon-btn" id="muteBtn" title="শব্দ অন/অফ">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7.5h2.5L10 4.5v11L6.5 12.5H4v-5Z"/><path d="M13 7.5c1 .9 1 4.1 0 5"/></svg>
        </button>
        <button class="icon-btn" id="fullscreenBtn" title="ফুল-স্ক্রিন">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3H4a1 1 0 0 0-1 1v3M13 3h3a1 1 0 0 1 1 1v3M17 13v3a1 1 0 0 1-1 1h-3M3 13v3a1 1 0 0 0 1 1h3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="errorBox"></div>
</main>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const bnDigits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const toBn = (n) => String(n).split("").map(d => bnDigits[d] ?? d).join("");
  const toEnDigits = (s) => String(s).replace(/[০-৯]/g, (d) => bnDigits.indexOf(d));

  const uploadScreen  = document.getElementById("uploadScreen");
  const readerArea    = document.getElementById("readerArea");
  const stage         = document.getElementById("stage");
  const loadingEl     = document.getElementById("loading");
  const bookWrap      = document.getElementById("bookWrap");
  const bookEl        = document.getElementById("book");
  const controlsEl    = document.getElementById("controls");
  const errorBox      = document.getElementById("errorBox");
  const changeBookBtn = document.getElementById("changeBookBtn");
  const pageInput     = document.getElementById("pageInput");
  const totalPagesLbl = document.getElementById("totalPages");
  const muteBtn       = document.getElementById("muteBtn");

  let pageFlip;
  let totalPages = 0;

  // ---------------- পজিশন ও জুম স্টেট ----------------
  let zoom = 1;
  let panX = 0;
  let panY = 0;
  let rotateDeg = 0;
  let isMuted = false;

  function updateTransform() {
    if (zoom <= 1) {
      panX = 0;
      panY = 0;
    }
    bookWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom}) rotate(${rotateDeg}deg)`;
  }

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;
    rotateDeg = 0;
    updateTransform();
  }

  // ---------------- ড্রাগ ও প্যান লজিক ----------------
  let startX = 0, startY = 0;
  let initialPanX = 0, initialPanY = 0;
  let isDragging = false;

  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest("#controls") || e.target.closest(".side-nav-btn")) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    initialPanX = panX;
    initialPanY = panY;

    try { stage.setPointerCapture(e.pointerId); } catch(err){}
  });

  stage.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    const diffX = e.clientX - startX;
    const diffY = e.clientY - startY;

    if (zoom > 1) {
      panX = initialPanX + diffX;
      panY = initialPanY + diffY;
      updateTransform();
    }
  });

  stage.addEventListener("pointerup", (e) => {
    if (!isDragging) return;
    isDragging = false;
    try { stage.releasePointerCapture(e.pointerId); } catch(err){}

    const diffX = e.clientX - startX;
    const diffY = e.clientY - startY;
    const minSwipeDist = 35;

    // Zoom == 1 মোডে (যা এখন বাই-ডিফল্ট বড় দেখাচ্ছে) নিখুঁত সোয়াইপ
    if (zoom === 1 && pageFlip && Math.abs(diffX) > minSwipeDist && Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX < 0) {
        pageFlip.flipNext();
      } else {
        pageFlip.flipPrev();
      }
    }
  });

  stage.addEventListener("pointercancel", () => {
    isDragging = false;
  });

  // ---------------- সাইড বাটন নেভিগেশন ----------------
  document.getElementById("sidePrevBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if (pageFlip) pageFlip.flipPrev();
  });

  document.getElementById("sideNextBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if (pageFlip) pageFlip.flipNext();
  });

  // ---------------- কাগজের সাউন্ড ----------------
  let audioCtx;
  function playFlipSound() {
    if (isMuted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const duration = 0.28;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        let t = i / bufferSize;
        let paperEnvelope = Math.sin(t * Math.PI) * Math.pow(1 - t, 0.4);
        data[i] = (Math.random() * 2 - 1) * paperEnvelope;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(1100, now);
      filter.frequency.exponentialRampToValueAtTime(3400, now + duration * 0.35);
      filter.frequency.exponentialRampToValueAtTime(750, now + duration);
      filter.Q.value = 1.6;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.45, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
    } catch (e) {
      console.warn("Sound error:", e);
    }
  }

  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle("muted", isMuted);
  });

  // ---------------- নেভিগেশন ও কাউন্টার ----------------
  function updateCounter(current) {
    pageInput.value = current + 1;
    totalPagesLbl.textContent = `/ ${toBn(totalPages)}`;
    document.getElementById("firstBtn").disabled = current === 0;
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").disabled = current >= totalPages - 1;
    document.getElementById("lastBtn").disabled = current >= totalPages - 1;
  }

  function goToPage(index) {
    const clamped = Math.max(0, Math.min(totalPages - 1, index));
    pageFlip.turnToPage(clamped);
    updateCounter(clamped);
  }

  // ---------------- জুম ও রোটেট ----------------
  document.getElementById("zoomInBtn").addEventListener("click", () => {
    zoom = Math.min(3.5, zoom + 0.3);
    updateTransform();
  });

  document.getElementById("zoomOutBtn").addEventListener("click", () => {
    zoom = Math.max(0.6, zoom - 0.3);
    updateTransform();
  });

  document.getElementById("rotateLeftBtn").addEventListener("click", () => {
    rotateDeg -= 90;
    updateTransform();
  });

  document.getElementById("rotateRightBtn").addEventListener("click", () => {
    rotateDeg += 90;
    updateTransform();
  });

  document.getElementById("resetViewBtn").addEventListener("click", resetView);

  // ---------------- PDF লোডিং ও ডিসপ্লে ----------------
  function showError(message) {
    loadingEl.classList.remove("active");
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function resetToUpload() {
    uploadScreen.style.display = "block";
    readerArea.classList.remove("active");
    controlsEl.classList.remove("active");
    changeBookBtn.style.display = "none";
    errorBox.style.display = "none";
    bookEl.innerHTML = "";
    bookEl.style.display = "none";
    resetView();
    document.getElementById("pdfInput").value = "";
  }

  async function openPDF(file) {
    uploadScreen.style.display = "none";
    readerArea.classList.add("active");
    loadingEl.classList.add("active");
    errorBox.style.display = "none";

    await new Promise(r => setTimeout(r, 100));

    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPages = pdf.numPages;

      const firstPage = await pdf.getPage(1);
      const baseViewport = firstPage.getViewport({ scale: 1 });
      const aspect = baseViewport.height / baseViewport.width;

      const isMobile = window.innerWidth <= 768;
      const stageW = stage.clientWidth || window.innerWidth;
      const stageH = stage.clientHeight || (window.innerHeight - 100);

      let pWidth, pHeight;

      // ডিফল্ট পেজ রেন্ডার সাইজ বাড়িয়ে বড় ও স্পষ্ট ভিউ সেট করা হলো
      if (isMobile) {
        pWidth = stageW * 0.98;
        pHeight = pWidth * aspect;
      } else {
        let maxW = (stageW * 0.98) / 2;
        let maxH = stageH * 0.96;

        if (maxW * aspect > maxH) {
          pHeight = maxH * 1.25; 
          pWidth = pHeight / aspect;
        } else {
          pWidth = maxW * 1.25;
          pHeight = pWidth * aspect;
        }
      }

      // লেখার ক্ল্যারিটি আরও হাই-ডেফিনিশন করতে ক্যানভাস স্কেল বাড়ানো হলো
      const canvasScale = Math.max(3, (pWidth * 2) / baseViewport.width);

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: canvasScale });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        pageDiv.appendChild(canvas);
        bookEl.appendChild(pageDiv);
      }

      loadingEl.classList.remove("active");
      bookEl.style.display = "block";
      controlsEl.classList.add("active");
      changeBookBtn.style.display = "inline-flex";

      pageFlip = new St.PageFlip(bookEl, {
        width: Math.round(pWidth),
        height: Math.round(pHeight),
        size: "fixed",
        showCover: false,
        usePortrait: isMobile,
        mobileScrollSupport: false,
        drawShadow: true,
        maxShadowOpacity: 0.5
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));
      
      pageFlip.on("flip", (e) => {
        updateCounter(e.data);
        playFlipSound();
      });

      updateCounter(0);
    } catch (err) {
      showError("PDF ফাইলটি পড়া যায়নি। সমস্যা: " + err.message);
      console.error(err);
    }
  }

  document.getElementById("pdfInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) openPDF(file);
  });

  changeBookBtn.addEventListener("click", resetToUpload);

  document.getElementById("firstBtn").addEventListener("click", () => goToPage(0));
  document.getElementById("prevBtn").addEventListener("click", () => pageFlip.flipPrev());
  document.getElementById("nextBtn").addEventListener("click", () => pageFlip.flipNext());
  document.getElementById("lastBtn").addEventListener("click", () => goToPage(totalPages - 1));

  pageInput.addEventListener("change", () => {
    const n = parseInt(toEnDigits(pageInput.value), 10);
    if (!isNaN(n)) goToPage(n - 1);
  });

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    const elem = document.documentElement;
    if (!document.fullscreenElement) {
      elem.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  });
</script>

</body>
</html>
