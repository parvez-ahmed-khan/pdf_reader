<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>বুক রিডার</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
  :root {
    --bg: #14121a;
    --bg-2: #1c1926;
    --ink: #ece6d8;
    --muted: #948d9c;
    --paper: #f6efdd;
    --accent: #c9a24b;
    --accent-dim: rgba(201, 162, 75, 0.16);
    --bar-bg: rgba(255,255,255,0.045);
    --bar-border: rgba(255,255,255,0.09);
    --radius-lg: 20px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background: radial-gradient(ellipse 1100px 620px at 50% 30%, var(--bg-2), var(--bg) 72%);
    color: var(--ink);
    font-family: "Hind Siliguri", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  header {
    padding: 24px 30px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .wordmark {
    font-family: "Fraunces", serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .wordmark span { color: var(--accent); }

  #changeBookBtn {
    display: none;
    align-items: center;
    gap: 7px;
    background: none;
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  #changeBookBtn:hover { color: var(--ink); border-color: rgba(255,255,255,0.32); background: rgba(255,255,255,0.03); }
  #changeBookBtn svg { width: 15px; height: 15px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 14px 36px;
  }

  /* ---------- আপলোড স্ক্রিন ---------- */
  #uploadScreen {
    text-align: center;
    max-width: 400px;
    width: 100%;
    padding: 52px 40px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
  }
  #uploadScreen .icon-wrap {
    width: 58px; height: 58px;
    margin: 0 auto 22px;
    border-radius: 16px;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
  }
  #uploadScreen .icon-wrap svg { width: 27px; height: 27px; color: var(--accent); }
  #uploadScreen h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 22px; margin: 0 0 10px; letter-spacing: 0.1px; }
  #uploadScreen p { color: var(--muted); font-size: 14px; margin: 0 0 28px; line-height: 1.7; }

  .pick-btn {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--accent);
    color: #201705;
    font-weight: 500;
    font-size: 15px;
    padding: 13px 30px;
    border-radius: var(--radius-full);
    cursor: pointer;
    box-shadow: 0 12px 24px -10px rgba(201, 162, 75, 0.45);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .pick-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .pick-btn:active { transform: translateY(0); }
  .pick-btn svg { width: 17px; height: 17px; }
  #pdfInput { display: none; }

  /* ---------- রিডার এলাকা ---------- */
  #readerArea {
    display: none;
    width: 100%;
    max-width: 1180px;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(10px);
  }
  #readerArea.active { display: flex; animation: rise 0.5s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  #readerArea:fullscreen, #readerArea:-webkit-full-screen {
    background: var(--bg);
    justify-content: center;
    padding: 24px;
    overflow: auto;
  }

  #stage {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  #stage::before {
    content: "";
    position: absolute;
    left: 50%; bottom: -28px;
    width: 58%; height: 38px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), transparent 72%);
    filter: blur(3px);
    pointer-events: none;
  }

  #loading { display: none; margin: 90px 0; text-align: center; color: var(--muted); font-size: 14.5px; }
  #loading.active { display: block; }
  #loading .spinner {
    width: 26px; height: 26px; margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #bookWrap {
    width: 100%;
    max-width: 1000px;
    transform-origin: top center;
    transition: transform 0.08s ease-out;
  }
  /* ফিক্স: বইকে সবসময় মাঝখানে রাখতে margin auto — এটাই আগের বাম-পাশে সরে যাওয়ার সমাধান */
  #book { width: 100%; display: none; margin: 0 auto; }
  .page { background: var(--paper); }
  .page canvas { width: 100%; height: 100%; display: block; }

  #controls {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 46px;
  }
  #controls.active { display: flex; }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    border-radius: var(--radius-full);
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    backdrop-filter: blur(8px);
  }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover:not(:disabled) { background: var(--accent-dim); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.28; cursor: default; }
  .icon-btn.muted { opacity: 0.4; }

  .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.1); margin: 0 4px; }

  .page-jump {
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px;
    font-size: 13.5px;
    color: var(--muted);
  }
  #pageInput {
    width: 38px; text-align: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 7px;
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
    padding: 5px 2px;
  }
  #pageInput::-webkit-outer-spin-button, #pageInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #errorBox {
    display: none;
    max-width: 420px;
    margin: 28px auto 0;
    padding: 15px 20px;
    border-radius: 12px;
    background: rgba(220, 90, 70, 0.1);
    border: 1px solid rgba(220, 90, 70, 0.3);
    color: #e8b9ae;
    font-size: 13.5px;
    text-align: center;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    #bookWrap { max-width: 100%; }
    header { padding: 20px 18px 16px; }
    #uploadScreen { padding: 42px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #loading .spinner { animation: none; border-top-color: var(--accent-dim); }
    #readerArea.active { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">পাঠ<span>ঘর</span></div>
  <button id="changeBookBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 1 1 1.8 4.3M4 10V6m0 4h4"/></svg>
    নতুন PDF খুলুন
  </button>
</header>

<main>

  <div id="uploadScreen">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4c-2-1-4.5-1.5-7-1.5v15c2.5 0 5 .5 7 1.5m0-15c2-1 4.5-1.5 7-1.5v15c-2.5 0-5 .5-7 1.5m0-15v15"/>
      </svg>
    </div>
    <h1>আপনার বইটি খুলুন</h1>
    <p>ফোন থেকে একটি PDF ফাইল বেছে নিন — পাতা উল্টিয়ে বইয়ের মতো পড়তে পারবেন। ফাইলটি শুধু আপনার ব্রাউজারেই খোলে, কোথাও আপলোড হয় না।</p>
    <label class="pick-btn" for="pdfInput">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10m0 0-3.5-3.5M10 13l3.5-3.5M4 15.5v1a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-1"/></svg>
      PDF বেছে নিন
    </label>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" />
  </div>

  <div id="readerArea">
    <div id="stage">
      <div id="loading">
        <div class="spinner"></div>
        বই খোলা হচ্ছে...
      </div>
      <div id="bookWrap">
        <div id="book"></div>
      </div>
    </div>

    <!-- সব নিয়ন্ত্রণ বইয়ের নিচে, একটাই জায়গায় -->
    <div id="controls">
      <div class="btn-group">
        <button class="icon-btn" id="firstBtn" title="প্রথম পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5 4.5 10l5 5M15.5 5v10"/></svg>
        </button>
        <button class="icon-btn" id="prevBtn" title="আগের পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 5 7.5 10l5 5"/></svg>
        </button>
        <div class="page-jump">
          <input type="number" id="pageInput" min="1" value="1" aria-label="পাতা নম্বর" />
          <span id="totalPages">/ ১</span>
        </div>
        <button class="icon-btn" id="nextBtn" title="পরের পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5l5 5-5 5"/></svg>
        </button>
        <button class="icon-btn" id="lastBtn" title="শেষ পাতা">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5l5 5-5 5M4.5 5v10"/></svg>
        </button>
      </div>

      <div class="btn-group">
        <button class="icon-btn" id="zoomOutBtn" title="জুম আউট">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M17 17l-3.8-3.8M6 8.5h5"/></svg>
        </button>
        <button class="icon-btn" id="zoomInBtn" title="জুম ইন">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M17 17l-3.8-3.8M8.5 6v5M6 8.5h5"/></svg>
        </button>
        <div class="divider"></div>
        <button class="icon-btn" id="muteBtn" title="সাউন্ড বন্ধ/চালু">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h2.5L10 4.5v11L6.5 12.5H4v-5Z"/><path d="M13 7.5c1 .9 1 4.1 0 5"/></svg>
        </button>
        <button class="icon-btn" id="fullscreenBtn" title="ফুল-স্ক্রিন">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H4a1 1 0 0 0-1 1v3M13 3h3a1 1 0 0 1 1 1v3M17 13v3a1 1 0 0 1-1 1h-3M3 13v3a1 1 0 0 0 1 1h3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="errorBox"></div>
</main>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const bnDigits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const toBn = (n) => String(n).split("").map(d => bnDigits[d] ?? d).join("");
  const toEnDigits = (s) => String(s).replace(/[০-৯]/g, (d) => bnDigits.indexOf(d));

  const uploadScreen  = document.getElementById("uploadScreen");
  const readerArea    = document.getElementById("readerArea");
  const stage         = document.getElementById("stage");
  const loadingEl     = document.getElementById("loading");
  const bookWrap      = document.getElementById("bookWrap");
  const bookEl        = document.getElementById("book");
  const controlsEl    = document.getElementById("controls");
  const errorBox      = document.getElementById("errorBox");
  const changeBookBtn = document.getElementById("changeBookBtn");
  const pageInput     = document.getElementById("pageInput");
  const totalPagesLbl = document.getElementById("totalPages");
  const muteBtn       = document.getElementById("muteBtn");

  let pageFlip;
  let totalPages = 0;
  let zoom = 1;
  let isMuted = false;

  // ---------------- পাতা ওল্টানোর সাউন্ড (কোনো ফাইল ছাড়াই, কোডে তৈরি) ----------------
  let audioCtx;
  function playFlipSound() {
    if (isMuted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const duration = 0.22;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(1800, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + duration);
      filter.Q.value = 0.8;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      noise.connect(filter).connect(gain).connect(audioCtx.destination);
      noise.start();
    } catch (e) { /* সাউন্ড না বাজলেও বইপড়া চলবে */ }
  }

  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    muteBtn.classList.toggle("muted", isMuted);
  });

  // ---------------- পাতা নম্বর, নেভিগেশন ----------------
  function updateCounter(current) {
    pageInput.value = current + 1;
    totalPagesLbl.textContent = `/ ${toBn(totalPages)}`;
    document.getElementById("firstBtn").disabled = current === 0;
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").disabled = current === totalPages - 1;
    document.getElementById("lastBtn").disabled = current === totalPages - 1;
  }

  function goToPage(index) {
    const clamped = Math.max(0, Math.min(totalPages - 1, index));
    pageFlip.turnToPage(clamped);
    updateCounter(clamped);
  }

  // ---------------- জুম: বাটন + মাউস হুইল + পিঞ্চ, স্বাধীনভাবে যত ইচ্ছা ----------------
  const ZOOM_MIN = 0.4;
  const ZOOM_MAX = 4;

  function applyZoom() {
    bookWrap.style.transform = `scale(${zoom})`;
  }
  function setZoom(newZoom) {
    zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    applyZoom();
  }

  document.getElementById("zoomOutBtn").addEventListener("click", () => setZoom(zoom - 0.2));
  document.getElementById("zoomInBtn").addEventListener("click", () => setZoom(zoom + 0.2));

  stage.addEventListener("wheel", (e) => {
    if (bookEl.style.display !== "block") return;
    e.preventDefault();
    setZoom(zoom - e.deltaY * 0.0015);
  }, { passive: false });

  let pinchStartDist = null;
  let pinchStartZoom = 1;
  function touchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = touchDistance(e.touches);
      pinchStartZoom = zoom;
    }
  }, { passive: true });
  stage.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const newDist = touchDistance(e.touches);
      setZoom(pinchStartZoom * (newDist / pinchStartDist));
    }
  }, { passive: false });
  stage.addEventListener("touchend", () => { pinchStartDist = null; });

  // ---------------- ফাইল খোলা ----------------
  function showError(message) {
    loadingEl.classList.remove("active");
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function resetToUpload() {
    uploadScreen.style.display = "block";
    readerArea.classList.remove("active");
    controlsEl.classList.remove("active");
    changeBookBtn.style.display = "none";
    errorBox.style.display = "none";
    bookEl.innerHTML = "";
    bookEl.style.display = "none";
    zoom = 1;
    applyZoom();
    document.getElementById("pdfInput").value = "";
  }

  async function openPDF(file) {
    uploadScreen.style.display = "none";
    readerArea.classList.add("active");
    loadingEl.classList.add("active");
    errorBox.style.display = "none";

    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPages = pdf.numPages;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2 });

        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        if (i === 1 || i === pdf.numPages) pageDiv.setAttribute("data-density", "hard");
        pageDiv.appendChild(canvas);
        bookEl.appendChild(pageDiv);
      }

      loadingEl.classList.remove("active");
      bookEl.style.display = "block";
      controlsEl.classList.add("active");
      changeBookBtn.style.display = "inline-flex";

      const firstPage = await pdf.getPage(1);
      const baseViewport = firstPage.getViewport({ scale: 1 });
      const aspect = baseViewport.height / baseViewport.width;
      const baseWidth = 480;
      const baseHeight = Math.round(baseWidth * aspect);

      pageFlip = new St.PageFlip(bookEl, {
        width: baseWidth,
        height: baseHeight,
        size: "stretch",
        minWidth: 260,
        maxWidth: 700,
        minHeight: Math.round(260 * aspect),
        maxHeight: Math.round(700 * aspect),
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: true,
        drawShadow: true,
        maxShadowOpacity: 0.5,
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));
      pageFlip.on("flip", (e) => {
        updateCounter(e.data);
        playFlipSound();
      });
      updateCounter(0);
    } catch (err) {
      showError("বইটা খোলা যায়নি। ফাইলটা ঠিকঠাক PDF কিনা যাচাই করুন। (" + err.message + ")");
      console.error(err);
    }
  }

  document.getElementById("pdfInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) openPDF(file);
  });

  changeBookBtn.addEventListener("click", resetToUpload);

  document.getElementById("firstBtn").addEventListener("click", () => goToPage(0));
  document.getElementById("prevBtn").addEventListener("click", () => pageFlip.flipPrev());
  document.getElementById("nextBtn").addEventListener("click", () => pageFlip.flipNext());
  document.getElementById("lastBtn").addEventListener("click", () => goToPage(totalPages - 1));

  pageInput.addEventListener("change", () => {
    const n = parseInt(toEnDigits(pageInput.value), 10);
    if (!isNaN(n)) goToPage(n - 1);
  });

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      readerArea.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  });
</script>

</body>
</html>
